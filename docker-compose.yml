services:
  nodo1:
    build: .
    image: comedor-rosita-api:local
    hostname: nodo1
    environment: &api-environment
      ADMIN_TOKEN: ${ADMIN_TOKEN:-token-secreto-rosita}
      HOST: 0.0.0.0
      PORT: 4000
      NODE_ENV: production
    networks:
      clusternet:
        ipv4_address: 172.30.21.11

  nodo2:
    build: .
    image: comedor-rosita-api:local
    hostname: nodo2
    environment: *api-environment
    networks:
      clusternet:
        ipv4_address: 172.30.21.12

  nodo3:
    build: .
    image: comedor-rosita-api:local
    hostname: nodo3
    environment: *api-environment
    networks:
      clusternet:
        ipv4_address: 172.30.21.13

  lb:
    build: ./infra/nginx
    image: comedor-rosita-lb:local
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/apache/certs:/etc/nginx/custom-certs:ro
    networks:
      clusternet:
        ipv4_address: 172.30.21.10
    depends_on:
      nodo1:
        condition: service_healthy
      nodo2:
        condition: service_healthy
      nodo3:
        condition: service_healthy

networks:
  clusternet:
    ipam:
      config:
        - subnet: 172.30.21.0/24
