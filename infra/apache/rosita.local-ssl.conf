<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName rosita.local
    DocumentRoot /var/www/rosita.local

    <Directory /var/www/rosita.local>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/rosita.local/rosita.local.pem
    SSLCertificateKeyFile /etc/apache2/ssl/rosita.local/rosita.local-key.pem

    ProxyPreserveHost On
    ProxyPassMatch ^/api$ http://127.0.0.1:4000/api
    ProxyPass /api/ http://127.0.0.1:4000/api/ connectiontimeout=5 timeout=30
    ProxyPassReverse /api/ http://127.0.0.1:4000/api/
    ProxyPass /health http://127.0.0.1:4000/health connectiontimeout=5 timeout=10
    ProxyPassReverse /health http://127.0.0.1:4000/health

    ErrorLog ${APACHE_LOG_DIR}/rosita.local-error.log
    CustomLog ${APACHE_LOG_DIR}/rosita.local-access.log combined
</VirtualHost>
</IfModule>
