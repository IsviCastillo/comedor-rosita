upstream rosita_cluster {
    zone rosita_cluster 64k;
    server 172.30.21.11:4000 max_fails=1 fail_timeout=15s;
    server 172.30.21.12:4000 max_fails=1 fail_timeout=15s;
    server 172.30.21.13:4000 max_fails=1 fail_timeout=15s;
}

server {
    listen 80 default_server;
    server_name rosita.local localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name rosita.local localhost;

    ssl_certificate /etc/nginx/certs/rosita.local.pem;
    ssl_certificate_key /etc/nginx/certs/rosita.local-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://rosita_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Upstream-Server $upstream_addr always;
    }
}
